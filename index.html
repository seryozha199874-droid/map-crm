<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
    <style>
        body, html { padding: 0; margin: 0; width: 100%; height: 100%; font-family: sans-serif; }
        #map { width: 100%; height: 100%; }
        .status-btn { display: block; width: 100%; padding: 12px; margin: 6px 0; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; color: white; cursor: pointer; }
        .btn-work { background-color: #28a745; } 
        .btn-think { background-color: #ffc107; color: #000; } 
        .btn-close { background-color: #dc3545; } 
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        
        // СЮДА МЫ ВПИШЕМ HTTPS-ССЫЛКУ, КОГДА РЕШИШЬ ВОПРОС С ДОМЕНОМ
        const API_URL = "http://193.124.131.25:8000/api";

        ymaps.ready(init);

        async function init() {
            let map = new ymaps.Map("map", {
                center: [55.16, 61.4], // Челябинск
                zoom: 11,
                controls: ['zoomControl', 'geolocationControl']
            });

            let clusterer = new ymaps.Clusterer({
                preset: 'islands#blueClusterIcons',
                groupByCoordinates: true, 
                clusterDisableClickZoom: true
            });

            function getPresetByStatus(status) {
                if (status === 'Работают') return 'islands#greenIcon';
                if (status === 'Думают') return 'islands#yellowIcon';
                if (status === 'Закрыты') return 'islands#redIcon';
                return 'islands#blueIcon'; 
            }

            try {
                // ДЕЛАЕМ ЗАПРОС К НАШЕМУ БЭКЕНДУ
                let response = await fetch(`${API_URL}/points`);
                let pointsData = await response.json();

                let geoObjects = [];
                pointsData.forEach(point => {
                    let placemark = new ymaps.Placemark(point.coords, {
                        balloonContentHeader: `<strong>${point.name}</strong>`,
                        balloonContentBody: `
                            <div style="margin-bottom: 12px; font-size: 14px;">${point.address}</div>
                            <button class="status-btn btn-work" onclick="updateStatus('${point.id}', 'Работают')">🟢 Работают</button>
                            <button class="status-btn btn-think" onclick="updateStatus('${point.id}', 'Думают')">🟡 Думают</button>
                            <button class="status-btn btn-close" onclick="updateStatus('${point.id}', 'Закрыты')">🔴 Закрыты</button>
                        `
                    }, { preset: getPresetByStatus(point.status) });
                    geoObjects.push(placemark);
                });
                clusterer.add(geoObjects);
                map.geoObjects.add(clusterer);
            } catch (e) {
                console.error("Ошибка загрузки", e);
                tg.showAlert("Браузер заблокировал запрос (Нужен HTTPS) или сервер недоступен.");
            }
        }

        window.updateStatus = async function(id, status) {
            try {
                let response = await fetch(`${API_URL}/update_status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, status: status })
                });
                
                if (response.ok) {
                    tg.showAlert(`✅ Статус сохранен в базу: ${status}`);
                    // Тут окно больше не закрывается! Менеджер может отмечать дальше
                } else {
                    tg.showAlert("Ошибка при сохранении");
                }
            } catch (e) {
                tg.showAlert("Ошибка связи с сервером");
            }
        }
    </script>
</body>
</html>
