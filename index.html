<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Скрипт Телеграма -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- API Яндекса -->
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
    <!-- Подключаем твою базу адресов -->
    <script src="points.js"></script>
    <style>
        body, html { padding: 0; margin: 0; width: 100%; height: 100%; font-family: sans-serif; }
        #map { width: 100%; height: 100%; }
        /* Стили для новых цветных кнопок */
        .status-btn {
            display: block; width: 100%; padding: 12px; margin: 6px 0;
            border: none; border-radius: 6px; font-size: 15px; font-weight: bold; color: white; cursor: pointer;
        }
        .btn-work { background-color: #28a745; } /* Зеленый */
        .btn-think { background-color: #ffc107; color: #000; } /* Желтый */
        .btn-close { background-color: #dc3545; } /* Красный */
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        ymaps.ready(init);

        function init() {
            // Инициализация карты с Поиском и Геолокацией
            let map = new ymaps.Map("map", {
                center: [55.16, 61.4], // Центр (Челябинск)
                zoom: 11,
                controls: ['zoomControl', 'searchControl', 'geolocationControl']
            });

            // Кластеризатор для группировки одинаковых адресов
            let clusterer = new ymaps.Clusterer({
                preset: 'islands#blueClusterIcons',
                groupByCoordinates: true, // ВАЖНО: объединяет точки с одинаковыми координатами в список
                clusterDisableClickZoom: true,
                clusterHideIconOnBalloonOpen: false,
                geoObjectHideIconOnBalloonOpen: false
            });

            // Читаем кэш телефона
            function getSavedStatus(id) {
                return localStorage.getItem('point_status_' + id);
            }

            // Назначаем цвет метки в зависимости от сохраненного статуса
            function getPresetByStatus(status) {
                if (status === 'Работают') return 'islands#greenIcon';
                if (status === 'Думают') return 'islands#yellowIcon';
                if (status === 'Закрыты') return 'islands#redIcon';
                return 'islands#blueIcon'; // Синий для новых, нетронутых точек
            }

            let geoObjects = [];

            // Пробегаемся по твоей базе из points.js
            pointsData.forEach(point => {
                let savedStatus = getSavedStatus(point.id);
                let currentPreset = getPresetByStatus(savedStatus);

                let placemark = new ymaps.Placemark(point.coords, {
                    balloonContentHeader: `<strong>${point.name}</strong>`,
                    balloonContentBody: `
                        <div style="margin-bottom: 12px; font-size: 14px; color: #555;">${point.address}</div>
                        <button class="status-btn btn-work" onclick="sendData('${point.id}', 'Работают')">🟢 Работают</button>
                        <button class="status-btn btn-think" onclick="sendData('${point.id}', 'Думают')">🟡 Думают</button>
                        <button class="status-btn btn-close" onclick="sendData('${point.id}', 'Закрыты')">🔴 Закрыты</button>
                    `
                }, {
                    preset: currentPreset
                });

                geoObjects.push(placemark);
            });

            clusterer.add(geoObjects);
            map.geoObjects.add(clusterer);
        }

        // Функция отправки данных при нажатии на цветную кнопку
        window.sendData = function(id, status) {
            // 1. Запоминаем статус в кэш телефона навсегда (до очистки кэша)
            localStorage.setItem('point_status_' + id, status);

            // 2. Ищем данные точки
            let pt = pointsData.find(p => p.id === id);
            let data = {
                id: id,
                name: pt.name,
                address: pt.address,
                status: status
            };
            
            // 3. Отправляем в бота. 
            // ВНИМАНИЕ: метод tg.sendData АВТОМАТИЧЕСКИ закрывает приложение Телеграма!
            // Когда менеджер снова нажмет "Открыть карту", точка уже будет перекрашена.
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
